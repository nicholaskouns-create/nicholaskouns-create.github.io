name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "README.md"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - "README.md"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check assets, certificate copies and rendering
        run: node --test scripts/check_website.cjs

  publish:
    name: Verify live user-site atlas
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the live Pages document
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
          for attempt in $(seq 1 24); do
            status="$(curl -sS -L -o /tmp/pages.html -w '%{http_code}' --max-time 20 "$site_url" || true)"
            if [ "$status" = "200" ] && grep -Eq 'Nicholas Kouns · Personal site|The Mathematical City' /tmp/pages.html; then
              echo "Live Pages verified: $site_url"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; waiting for Pages propagation..."
            sleep 5
          done

          echo "Pages did not serve the expected personal-site atlas within the verification window."
          head -80 /tmp/pages.html || true
          exit 1

      - name: Publish receipt
        shell: bash
        run: |
          {
            echo "## GitHub Pages publish receipt"
            echo
            echo "This user-site repository publishes from \`main\` via pages-build-deployment."
            echo "The live root is the personal-site atlas, not a force-pushed \`gh-pages\` City clone."
            echo
            echo "Verified live URL: https://${GITHUB_REPOSITORY_OWNER}.github.io/"
            echo "Current City runtime: https://${GITHUB_REPOSITORY_OWNER}.github.io/E47-Kartekeya/"
          } >> "$GITHUB_STEP_SUMMARY"
