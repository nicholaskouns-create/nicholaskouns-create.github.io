name: E47 observatory refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh public repository metrics and authorized traffic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 e47-research-portal/scripts/refresh_metrics.py
      - name: Render social share PNG from self-hosted SVG
        run: |
          python3 -m pip install --quiet cairosvg==2.7.1
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='e47-research-portal/assets/share-cover.svg',write_to='e47-research-portal/assets/share-cover.png',output_width=1200,output_height=630)
          PY
      - name: Commit updated public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e47-research-portal/traffic-live.json e47-research-portal/assets/share-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh E47 public traffic snapshot and share image"
            git push
          fi
