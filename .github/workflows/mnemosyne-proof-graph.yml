name: Mnemosyne Proof Graph Verification
on:
  push:
    branches: [main]
    paths:
      - 'mnemosyne/**'
      - '.github/workflows/mnemosyne-proof-graph.yml'
  pull_request:
    paths:
      - 'mnemosyne/**'
      - '.github/workflows/mnemosyne-proof-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser modules
        run: |
          node --check mnemosyne/mnemosyne.js
          node --check mnemosyne/proof-observatory.js
          node --check mnemosyne/city-instruments.js
          node --check mnemosyne/forge-engine.js
          node --check mnemosyne/forge-ui.js
          node --experimental-default-type=module mnemosyne/test-forge.mjs
      - name: Verify certificate and graph
        run: |
          python mnemosyne/tools/instruments.py
          python mnemosyne/tools/verify_graph.py
