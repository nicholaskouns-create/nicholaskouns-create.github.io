name: NOESIS evidence registry checks
on:
  push:
    branches: [main]
    paths:
      - "noesis/**"
      - "scripts/check_noesis.cjs"
      - ".github/workflows/noesis-validate.yml"
  pull_request:
    paths:
      - "noesis/**"
      - "scripts/check_noesis.cjs"
      - ".github/workflows/noesis-validate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate NOESIS registry, evidence rules and Jekyll preservation
        run: node scripts/check_noesis.cjs
