<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix Receipt · City Handoff</title><style>body{background:#07110e;color:#caffc3;font:15px ui-monospace,monospace;margin:0;padding:24px}main{max-width:900px;margin:auto}button,a{display:inline-block;color:#75ff6c;background:#10291a;border:1px solid #458953;border-radius:6px;padding:10px;margin:4px;cursor:pointer;text-decoration:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#030905;border:1px solid #345b3b;padding:16px;border-radius:8px}input{margin:12px 0}h1{color:#75ff6c}</style></head><body><main><a href="./">← Matrix Simulator</a><h1>QUANTUM RECEIPT HANDOFF</h1><p id="target"></p><p>Import a Matrix JSON receipt. This standalone bridge verifies the state and digest, displays its amplitudes, and provides a portable payload for the destination app. It does not modify the destination application.</p><input id="file" type="file" accept=".json,application/json"><button id="paste">PASTE JSON</button><button id="copy" disabled>COPY VERIFIED RECEIPT</button><p id="status" role="status">Waiting for receipt.</p><pre id="view"></pre><div id="dest"></div></main><script>
const targets={observatory:{label:'Observatory',url:'https://nicholaskouns-create.github.io/E47-Kartekeya/interfaces/observatory/'},'proof-forge':{label:'Proof Forge',url:'https://pepper-raven-blade-heart.grok.me/'},melanie:{label:'MELANIE',url:'https://nicholaskouns-create.github.io/melanie/'}};
const key=new URLSearchParams(location.search).get('target'),t=targets[key]||targets.observatory;document.getElementById('target').textContent='DESTINATION · '+t.label;const link=document.createElement('a');link.href=t.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='OPEN '+t.label.toUpperCase()+' ↗';document.getElementById('dest').append(link);
const canonical=x=>Array.isArray(x)?'['+x.map(canonical).join(',')+']':x&&typeof x==='object'?'{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}':JSON.stringify(x);
let verified='';
async function inspect(s){const x=JSON.parse(s);if(x.schema!=='city.quantum.state-receipt.v1'||x.qubits!==3||x.basis!=='q0q1q2'||!Array.isArray(x.circuit)||!Array.isArray(x.statevector)||x.statevector.length!==8||!x.statevector.every(z=>Array.isArray(z)&&z.length===2&&z.every(Number.isFinite)))throw Error('Invalid receipt schema');const norm=x.statevector.reduce((n,z)=>n+z[0]**2+z[1]**2,0);if(Math.abs(norm-1)>1e-8)throw Error('State not normalized');if(!x.integrity||x.integrity.algorithm!=='SHA-256')throw Error('Missing digest');const {integrity,...payload}=x;const bytes=new TextEncoder().encode(canonical(payload));const d=await crypto.subtle.digest('SHA-256',bytes);const hex=[...new Uint8Array(d)].map(v=>v.toString(16).padStart(2,'0')).join('');if(hex!==integrity.digest)throw Error('Digest mismatch');verified=JSON.stringify(x,null,2);document.getElementById('view').textContent='Circuit gates: '+x.circuit.length+'\nNorm: '+norm.toFixed(12)+'\nMeasurement: '+JSON.stringify(x.measurement)+'\n\n'+x.statevector.map((z,i)=>'|'+i.toString(2).padStart(3,'0')+'>  '+z[0].toFixed(8)+' + '+z[1].toFixed(8)+'i').join('\n');document.getElementById('status').textContent='SHA-256 VERIFIED · READY FOR '+t.label.toUpperCase();document.getElementById('copy').disabled=false;}
async function load(s){try{verified='';document.getElementById('copy').disabled=true;await inspect(s)}catch(e){document.getElementById('status').textContent='REJECTED: '+e.message;document.getElementById('view').textContent='';}}
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>100000){document.getElementById('status').textContent='File too large';return;}await load(await f.text())}};
document.getElementById('paste').onclick=async()=>{try{await load(await navigator.clipboard.readText())}catch(e){document.getElementById('status').textContent='Clipboard unavailable: '+e.message}};
document.getElementById('copy').onclick=async()=>{if(verified)try{await navigator.clipboard.writeText(verified);document.getElementById('status').textContent='Verified receipt copied for '+t.label}catch(e){document.getElementById('status').textContent=e.message}};
</script></body></html>
