<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050" role="img" aria-labelledby="ttl desc"><title id="ttl">E47 — Exact spectral selection and optimal contraction</title><desc id="desc">A code-generated Mathematical City research infographic showing the SU(2) triple tensor Casimir decomposition, retained spin 2 and spin 5 sectors, exact Richardson constants, convergence theorem and arbitrary spin generalization.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071116"/><stop offset=".62" stop-color="#0a151b"/><stop offset="1" stop-color="#071014"/></linearGradient><radialGradient id="halo"><stop stop-color="#55e2ce" stop-opacity=".18"/><stop offset="1" stop-color="#55e2ce" stop-opacity="0"/></radialGradient><linearGradient id="accent"><stop stop-color="#9df0d4"/><stop offset="1" stop-color="#69bed3"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9"/></filter><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#33525a" stroke-opacity=".15"/></pattern></defs><rect width="1600" height="2050" fill="url(#bg)"/><rect width="1600" height="2050" fill="url(#grid)"/><rect x="36" y="36" width="1528" height="1978" rx="12" fill="none" stroke="#38565d" stroke-width="2"/><text x="96" y="113" fill="#91dcca" font-size="24" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" letter-spacing="4">THE MATHEMATICAL CITY   /   E₄₇ RESEARCH OBSERVATORY</text><text x="1500" y="113" fill="#bba982" font-size="21" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="end">PLATE  /  001</text><line x1="96" y1="145" x2="1504" y2="145" stroke="#284045" stroke-width="2"/><text x="96" y="262" fill="#f2f3ec" font-size="112" font-weight="400" font-family="Georgia,Times New Roman,serif" >The invariant</text><text x="96" y="382" fill="#f2f3ec" font-size="112" font-weight="400" font-family="Georgia,Times New Roman,serif" >that iteration finds.</text><text x="101" y="450" fill="#a2b8b7" font-size="24" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" letter-spacing="1.5">FINITE SU(2) SELECTOR  ·  EXACT ORTHOGONAL PROJECTION  ·  SHARP CONVERGENCE</text><circle cx="1260" cy="328" r="255" fill="url(#halo)"/><rect x="96" y="503" width="1408" height="152" rx="18" fill="#10242a" stroke="#2b4a50" stroke-width="2"/><text x="130" y="558" fill="#f4f3e9" font-size="69" font-weight="400" font-family="Georgia,Times New Roman,serif" >125</text><text x="333" y="558" fill="#79d9c9" font-size="59" font-weight="400" font-family="Arial,Helvetica,sans-serif" >→</text><text x="445" y="558" fill="#a3f0d5" font-size="69" font-weight="400" font-family="Georgia,Times New Roman,serif" >47</text><text x="608" y="558" fill="#79d9c9" font-size="59" font-weight="400" font-family="Arial,Helvetica,sans-serif" >→</text><text x="717" y="558" fill="#f1d5a0" font-size="69" font-weight="400" font-family="Georgia,Times New Roman,serif" >5</text><line x1="881" y1="530" x2="881" y2="628" stroke="#355960" stroke-width="2"/><text x="920" y="561" fill="#e5eee7" font-size="45" font-weight="400" font-family="Georgia,Times New Roman,serif" >Ωc = 47 / 125</text><text x="921" y="606" fill="#93c6bd" font-size="19" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >EXACT RETAINED FRACTION  ·  0.376</text><text x="96" y="731" fill="#8fdcca" font-size="25" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" letter-spacing="3">01  /  THE SELECTOR</text><text x="96" y="795" fill="#f0f1e9" font-size="53" font-weight="400" font-family="Georgia,Times New Roman,serif" >A polynomial isolates two spectral islands.</text><text x="100" y="850" fill="#c3d3d0" font-size="30" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >H = V₂ ⊗ V₂ ⊗ V₂     dim H = 5³ = 125</text><line x1="114" y1="1120" x2="1487" y2="1120" stroke="#547077" stroke-width="2"/><rect x="135" y="1101" width="117" height="19" rx="9" fill="#29444d" opacity=".78"/><text x="193" y="1081" fill="#b0c3c4" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">1</text><text x="193" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 0</text><text x="193" y="1195" fill="#81999e" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 0</text><rect x="334" y="1045" width="117" height="75" rx="9" fill="#29444d" opacity=".78"/><text x="392" y="1025" fill="#b0c3c4" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">9</text><text x="392" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 1</text><text x="392" y="1195" fill="#81999e" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 2</text><rect x="533" y="933" width="117" height="187" rx="9" fill="#79d9c6" opacity=".95"/><rect x="533" y="933" width="117" height="187" rx="9" fill="none" stroke="#a8f5da" stroke-width="2"/><text x="591" y="913" fill="#a6f3d6" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">25</text><text x="591" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 2</text><text x="591" y="1195" fill="#8fe5cb" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 6</text><rect x="732" y="912" width="117" height="208" rx="9" fill="#29444d" opacity=".78"/><text x="790" y="892" fill="#b0c3c4" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">28</text><text x="790" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 3</text><text x="790" y="1195" fill="#81999e" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 12</text><rect x="931" y="919" width="117" height="201" rx="9" fill="#29444d" opacity=".78"/><text x="989" y="899" fill="#b0c3c4" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">27</text><text x="989" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 4</text><text x="989" y="1195" fill="#81999e" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 20</text><rect x="1130" y="954" width="117" height="166" rx="9" fill="#79d9c6" opacity=".95"/><rect x="1130" y="954" width="117" height="166" rx="9" fill="none" stroke="#a8f5da" stroke-width="2"/><text x="1188" y="934" fill="#a6f3d6" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">22</text><text x="1188" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 5</text><text x="1188" y="1195" fill="#8fe5cb" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 30</text><rect x="1329" y="1017" width="117" height="103" rx="9" fill="#29444d" opacity=".78"/><text x="1387" y="997" fill="#b0c3c4" font-size="27" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">13</text><text x="1387" y="1162" fill="#e0e8e3" font-size="23" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">j = 6</text><text x="1387" y="1195" fill="#81999e" font-size="18" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="middle">C = 42</text><text x="96" y="1265" fill="#f0e5c9" font-size="45" font-weight="400" font-family="Georgia,Times New Roman,serif" >K = (C − 6I)(C − 30I)</text><text x="96" y="1320" fill="#a3edd3" font-size="32" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >ker K = 5V₂ ⊕ 2V₅       dim = 25 + 22 = 47</text><line x1="96" y1="1370" x2="1504" y2="1370" stroke="#284045" stroke-width="2"/><text x="96" y="1435" fill="#8fdcca" font-size="25" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" letter-spacing="3">02  /  THE OPTIMAL ITERATION</text><text x="96" y="1503" fill="#f0f1e9" font-size="53" font-weight="400" font-family="Georgia,Times New Roman,serif" >Conditioning fixes the rate.</text><rect x="96" y="1540" width="682" height="280" rx="22" fill="#0c1c22" stroke="#35565a" stroke-width="2"/><rect x="800" y="1540" width="704" height="280" rx="22" fill="#0c1c22" stroke="#35565a" stroke-width="2"/><text x="126" y="1590" fill="#a7c3c1" font-size="21" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >SPECTRAL EXTREMES OF K²</text><text x="126" y="1652" fill="#e9eee6" font-size="36" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >a = 11,664</text><text x="126" y="1708" fill="#e9eee6" font-size="36" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >b = 186,624</text><text x="126" y="1774" fill="#9fe7d0" font-size="40" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" >κ = b/a = 16</text><text x="829" y="1590" fill="#a7c3c1" font-size="21" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >OPTIMAL STATIONARY RICHARDSON</text><text x="829" y="1650" fill="#e9eee6" font-size="30" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >ε* = 2/(a+b) = 1/99,144</text><text x="829" y="1707" fill="#e9eee6" font-size="30" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >q* = (κ−1)/(κ+1)</text><text x="829" y="1774" fill="#9fe7d0" font-size="43" font-weight="600" font-family="IBM Plex Mono,Menlo,monospace" >q* = 15/17</text><rect x="96" y="1840" width="1408" height="100" rx="12" fill="#163038" stroke="#4b8b84" stroke-width="2"/><text x="128" y="1903" fill="#e6f3e8" font-size="35" font-weight="400" font-family="Georgia,Times New Roman,serif" >P₄₇ = limₘ→∞ (I − K²/99,144)ᵐ</text><text x="1490" y="1903" fill="#9ae3d1" font-size="27" font-weight="500" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="end">‖Tᵐ − P₄₇‖₂ = (15/17)ᵐ</text><text x="96" y="1977" fill="#a9bcb9" font-size="19" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" >GENERALIZATION  /  H = Vₛ⊗ⁿ  ·  Kₛ = ∏[J∈S](C−J(J+1)I)  ·  ker Kₛ = ⊕[J∈S] mⱼVⱼ</text><text x="1500" y="1977" fill="#a3adab" font-size="17" font-weight="400" font-family="IBM Plex Mono,Menlo,monospace" text-anchor="end">EXACT MATH  /  NOT PHYSICAL VALIDATION</text></svg>